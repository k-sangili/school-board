name: SchoolBoard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    tvOS: "17.0"
    watchOS: "10.0"
packages:
  BoardCore:
    path: BoardCore
targets:
  SchoolBoard:
    type: application
    platform: tvOS
    sources:
      - path: SchoolBoard
    dependencies:
      - package: BoardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: School Board
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SchoolBoardWatch:
    type: application
    platform: watchOS
    sources:
      - path: SchoolBoardWatch
      # Shared with the TV app: feed loading, colors, demo data and the feed config.
      - SchoolBoard/BoardStore.swift
      - SchoolBoard/Theme.swift
      - SchoolBoard/DemoData.swift
      - SchoolBoard/BoardConfig.example.json
      - path: SchoolBoard/BoardConfig.json
        optional: true
    dependencies:
      - package: BoardCore
      - target: SchoolBoardWidget
    info:
      path: SchoolBoardWatch/Info.plist
      properties:
        SchoolBoardAppGroup: $(APP_GROUP)
    entitlements:
      path: SchoolBoardWatch/SchoolBoardWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        APP_GROUP: group.${BUNDLE_ID}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.watch
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: School Board
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SchoolBoardWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: SchoolBoardWidget
      # Reads the snapshot the watch app saves; kid colors come from the same config.
      - SchoolBoardWatch/BoardSnapshot.swift
      - SchoolBoard/BoardStore.swift
      - SchoolBoard/Theme.swift
      - SchoolBoard/DemoData.swift
      - SchoolBoard/BoardConfig.example.json
      - path: SchoolBoard/BoardConfig.json
        optional: true
    dependencies:
      - package: BoardCore
    info:
      path: SchoolBoardWidget/Info.plist
      properties:
        CFBundleDisplayName: School Board
        SchoolBoardAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SchoolBoardWidget/SchoolBoardWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        APP_GROUP: group.${BUNDLE_ID}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.watch.widget
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  SchoolBoard:
    build:
      targets:
        SchoolBoard: all
    run:
      config: Debug
  SchoolBoardWatch:
    build:
      targets:
        SchoolBoardWatch: all
    run:
      config: Debug
